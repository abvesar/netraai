name: safety-ci

on:
  push:
  pull_request:

jobs:
  safety-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-can hikvision-isapi-cli SQLAlchemy psycopg2-binary

      - name: Static syntax gate
        run: python -m compileall .

      - name: Unit safety gate
        run: python -m unittest discover -s tests -p "test_*.py" -v
